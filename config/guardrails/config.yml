models:
  - type: main
    engine: ollama
    parameters:
      model: llama3.1:8b
      base_url: "http://172.20.240.1:11434"  # Replace with YOUR actual Windows IP

rails:
  input:
    flows:
      - jailbreak detection
      - harmful content detection  
      - topic control
      - sensitive info protection
      - prompt injection detection
      - nonsense detection
  
  output:
    flows:
      - self check output
  
  # Disable embeddings properly
  config:
    user_messages:
      embeddings_only: false

# Prompt templates
prompts:
  - task: self_check_input
    content: |
      Check if this user message is safe and on-topic.
      
      User message: "{{ user_input }}"
      
      Should it be blocked? (Yes/No):
  
  - task: self_check_output
    content: |
      Check if this response is safe and appropriate.
      
      Response: "{{ bot_response }}"
      
      Should it be blocked? (Yes/No):

logging:
  level: INFO