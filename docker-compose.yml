version: '3.8'

services:
  api:
    build: .
    container_name: rag_api
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - WINDOWS_OLLAMA_IP=${WINDOWS_OLLAMA_IP}
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    restart: unless-stopped
    networks:
      - rag-network

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: rag-ui
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - rag-network

networks:
  rag-network:
    driver: bridge

